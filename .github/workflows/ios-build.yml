name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "js/**"
      - "css/**"
      - "index.html"
      - "manifest.json"
      - "capacitor.config.json"
      - "scripts/build-www.mjs"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:www

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build for iOS Simulator (unsigned - validates the project compiles)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/App/build/Logs
          retention-days: 7

  signed-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:www

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Set up signing (certificate + private key + provisioning profile)
        env:
          IOS_PRIVATE_KEY_PEM: ${{ secrets.IOS_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          exec > >(tee /tmp/signing-step.log) 2>&1
          set -x
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          P12_PASSWORD=$(openssl rand -base64 24)
          { set +x; } 2>/dev/null

          # Turn the checked-in certificate + the private key secret into a .p12
          echo "$IOS_PRIVATE_KEY_PEM" > ios_distribution.key
          openssl x509 -in ios/signing/distribution.cer -inform DER -out ios_distribution.pem -outform PEM
          openssl pkcs12 -export \
            -inkey ios_distribution.key \
            -in ios_distribution.pem \
            -out ios_distribution.p12 \
            -password pass:"$P12_PASSWORD" \
            -legacy
          set -x

          # Create a temporary keychain for this build only and import the certificate
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          { set +x; } 2>/dev/null
          security import ios_distribution.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          set -x
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/[\"]//g')
          security list-keychains -d user -s build.keychain $EXISTING_KEYCHAINS
          { set +x; } 2>/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          set -x

          # Install the provisioning profile where Xcode expects to find it
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          security cms -D -i ios/signing/Dinner_Made_Easy.mobileprovision > /tmp/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/profile.plist)
          cp ios/signing/Dinner_Made_Easy.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

          # Clean up loose files with the private key/passwords in them
          rm -f ios_distribution.key ios_distribution.pem ios_distribution.p12

      - name: Upload signing step log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signing-step-log
          path: /tmp/signing-step.log
          retention-days: 7

      - name: Archive (signed, release configuration)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -sdk iphoneos -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive

      - name: Export a signed .ipa
        working-directory: ios/App
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.dinnermadeeasy.app</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Clean up the temporary keychain
        if: always()
        run: security delete-keychain build.keychain || true

      - name: Upload the signed .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Dinner-Made-Easy-signed-ipa
          path: ios/App/build/export/*.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-signed-build-log
          path: ios/App/build/Logs
          retention-days: 7
