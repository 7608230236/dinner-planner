name: Set App Store Subtitle (one-off)

on:
  push:
    paths:
      - "scripts/set-subtitle.mjs"
      - ".github/workflows/set-subtitle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  set-subtitle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install jose
      - run: node scripts/set-subtitle.mjs
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          TARGET_VERSION_STRING: "1.0.1"
          NEW_SUBTITLE: "Kosher Family Meal Planner"
      - if: always()
        run: |
          git config user.email "claude@anthropic.com"
          git config user.name "Claude"
          git add set-subtitle-result.txt
          git commit -m "Record set-subtitle result [skip ci]" || echo "nothing to commit"
          git push
